name: Sync Sugar Funeral Generator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Alex Lab
        uses: actions/checkout@v4

      - name: Copy latest Sugar Funeral generator
        run: |
          set -e
          mkdir -p generators/sugar-funeral-pairing/data
          curl -fsSL https://raw.githubusercontent.com/alex-sforza/sugar-funeral-pairing-generator/main/index-final.html -o generators/sugar-funeral-pairing/index.html
          curl -fsSL https://raw.githubusercontent.com/alex-sforza/sugar-funeral-pairing-generator/main/samply-loader.js -o generators/sugar-funeral-pairing/samply-loader.js
          curl -fsSL https://raw.githubusercontent.com/alex-sforza/sugar-funeral-pairing-generator/main/data/samply-links.json -o generators/sugar-funeral-pairing/data/samply-links.json

      - name: Commit synced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generators/sugar-funeral-pairing
          if git diff --cached --quiet; then
            echo "No Sugar Funeral changes to commit."
          else
            git commit -m "Sync latest Sugar Funeral generator"
            git push
          fi
